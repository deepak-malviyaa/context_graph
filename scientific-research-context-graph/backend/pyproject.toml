[project]
name = "scientific-research-context-graph-backend"
version = "0.1.0"
description = "Scientific Research Context Graph Backend"
requires-python = ">=3.10, <3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "neo4j>=5.20",
    "neo4j-agent-memory>=0.1.0",
    "sentence-transformers>=2.0",
    "langgraph>=0.1",
    "langchain-groq>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
